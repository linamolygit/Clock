<!DOCTYPE html>
<html lang="en">
<head>
 <link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://w3.org" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>'>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Panic Mode</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--accent:#ff9f0a;--panic:#ff453a;--bg:#f2f2f7;--card:rgba(255,255,255,.72);--text:#1d1d1f;--sub:#6e6e73;--line:rgba(0,0,0,.08);--fill:rgba(120,120,128,.14);--shadow:0 8px 30px rgba(0,0,0,.07);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:rgba(28,28,30,.66);--text:#f5f5f7;--sub:#98989d;--line:rgba(255,255,255,.1);--fill:rgba(120,120,128,.3);--shadow:0 8px 30px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#000;--card:rgba(28,28,30,.66);--text:#f5f5f7;--sub:#98989d;--line:rgba(255,255,255,.1);--fill:rgba(120,120,128,.3);--shadow:0 8px 30px rgba(0,0,0,.5)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{font-family:Inter,-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text);min-height:100%;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .4s,color .4s}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.glow i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.28;background:var(--accent);transition:background .5s}
.glow i:nth-child(1){width:46vmax;height:46vmax;top:-18vmax;left:-12vmax}
.glow i:nth-child(2){width:38vmax;height:38vmax;bottom:-16vmax;right:-10vmax;background:var(--panic);opacity:.16}
.wallp{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;transition:transform .35s ease-out}
.wall{position:absolute;inset:-8%;background-size:cover;background-position:center;opacity:0;transition:opacity .9s,filter .4s;will-change:transform}
.wall.on{opacity:1}
.wall.on:not(.grad){animation:kb 38s ease-in-out infinite alternate}
.wall.grad{background-size:300% 300%;animation:gshift 20s ease infinite}
.wall.still{animation:none!important}
@keyframes kb{from{transform:scale(1.04) translate(-1.6%,-1%)}to{transform:scale(1.18) translate(1.6%,1.2%)}}
@keyframes gshift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.wallp::after{content:"";display:none;position:absolute;inset:0;background:linear-gradient(110deg,transparent 38%,rgba(255,255,255,.13) 50%,transparent 62%);transform:translateX(-110%);animation:sweep 11s ease-in-out infinite 2s}
body.hasw:not(.still) .wallp::after{display:block}
@keyframes sweep{60%,100%{transform:translateX(110%)}}
body.hasw .glow{display:none}
body.hasw h1{color:#fff;text-shadow:0 2px 14px rgba(0,0,0,.45)}
.mini{border:none;background:var(--fill);color:var(--text);font:600 .82rem Inter,sans-serif;padding:7px 14px;border-radius:10px;cursor:pointer}
.mini+.mini{margin-left:6px}
.wn{font-size:.78rem;color:var(--sub);padding:0 16px 12px}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:22px 18px 40px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
h1{font-size:2rem;font-weight:700;letter-spacing:-.03em}
.btns{display:flex;gap:10px}
.ib{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--card);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.ib:active{transform:scale(.92)}
.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,430px),1fr));gap:16px}
.card{background:var(--card);backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);border:1px solid var(--line);border-radius:30px;padding:26px;box-shadow:var(--shadow)}
.card h2{font-size:.95rem;font-weight:600;color:var(--sub);margin-bottom:14px;letter-spacing:-.01em}
.digits{font-variant-numeric:tabular-nums;display:inline-flex;align-items:baseline;white-space:nowrap}
.digits i{display:inline-block;font-style:normal}
.digits i.r{animation:roll .45s cubic-bezier(.2,.9,.3,1.2)}
.down i.r{animation-name:rolld}
@keyframes roll{from{transform:translateY(45%);opacity:0}to{transform:none;opacity:1}}
@keyframes rolld{from{transform:translateY(-45%);opacity:0}to{transform:none;opacity:1}}
/* clock */
.clock{display:flex;align-items:center;gap:22px;flex-wrap:wrap;justify-content:center}
.analog{width:150px;height:150px;flex:none;cursor:pointer;border-radius:50%}
.analog:focus-visible,.ib:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 60%,transparent);outline-offset:2px}
.analog svg{width:100%;height:100%;filter:drop-shadow(0 6px 14px rgba(0,0,0,.14))}
.face{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.tk{stroke:var(--sub);stroke-width:1;opacity:.5}.tk.m{stroke-width:2.2;opacity:.9;stroke:var(--text)}
.hh,.mh{stroke:var(--text);stroke-linecap:round}
.hh{stroke-width:5}.mh{stroke-width:3.4}
.sh{stroke:var(--accent);stroke-width:1.8;stroke-linecap:round}
.pin{fill:var(--accent)}
.dig{flex:1;min-width:210px;text-align:center}
.time{font-size:clamp(2.6rem,9vw,3.7rem);font-weight:600;letter-spacing:-.04em;line-height:1}
.ampm{font-size:1.1rem;font-weight:600;color:var(--accent);margin-left:6px;letter-spacing:0}
.date{margin-top:10px;font-size:1rem;color:var(--sub);font-weight:500}
/* panic */
.panic{border-color:color-mix(in srgb,var(--panic) 35%,var(--line))}
.panic h2{color:var(--panic);display:flex;align-items:center;gap:8px}
.live{width:8px;height:8px;border-radius:50%;background:var(--panic);animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.prow{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.pl{font-size:.82rem;color:var(--sub);margin-bottom:4px}
.cd{font-size:clamp(2rem,7vw,2.7rem);font-weight:600;letter-spacing:-.03em;color:var(--panic)}
.money{font-size:clamp(1.6rem,6vw,2.1rem);font-weight:600;letter-spacing:-.02em;color:var(--text)}
.money b{color:var(--panic);font-weight:600}
.bar{height:10px;border-radius:10px;background:var(--fill);margin-top:20px;overflow:hidden}
.bar div{height:100%;width:0;border-radius:10px;background:linear-gradient(90deg,#ff9f0a,var(--panic));transition:width 1s linear}
.panic.hot{animation:hot 1.6s infinite}
@keyframes hot{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--panic) 22%,transparent),var(--shadow)}}
.note{font-size:.82rem;color:var(--sub);margin-top:12px}
/* rings */
.rw{display:flex;align-items:center;gap:24px;flex-wrap:wrap;justify-content:center}
.rings{width:190px;height:190px;flex:none}
.rings circle{fill:none;stroke-width:13;stroke-linecap:round}
.rings .t{stroke:var(--fill)}
.rings .p{transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1);transform:rotate(-90deg);transform-origin:100px 100px}
.leg{flex:1;min-width:190px;display:grid;gap:14px}
.lr{display:flex;align-items:center;gap:12px}
.lr .d{width:11px;height:11px;border-radius:50%;flex:none}
.lr b{display:block;font-size:1.25rem;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.lr span{font-size:.8rem;color:var(--sub)}
.lr div{flex:1}.lr em{font-style:normal;font-size:.82rem;color:var(--sub);font-variant-numeric:tabular-nums}
/* calendar */
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.ch h2{margin:0;font-size:1.15rem;color:var(--text);font-weight:600}
.cn{display:flex;gap:6px}
.cn button{border:none;background:var(--fill);color:var(--text);height:32px;min-width:32px;padding:0 10px;border-radius:16px;font:600 .85rem Inter,sans-serif;cursor:pointer}
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px;text-align:center}
.cg .w{font-size:.72rem;font-weight:600;color:var(--sub);padding-bottom:4px}
.cg .c{aspect-ratio:1;display:grid;place-items:center;font-size:.9rem;font-weight:500;border-radius:50%;font-variant-numeric:tabular-nums}
.cg .c.past{color:var(--sub);opacity:.55}
.cg .c.today{background:var(--accent);color:#fff;font-weight:700;box-shadow:0 4px 14px color-mix(in srgb,var(--accent) 55%,transparent)}
.cs{margin-top:14px;font-size:.85rem;color:var(--sub)}
/* sheet */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s}
.ov.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:520px;max-height:88vh;overflow-y:auto;background:var(--bg);border-radius:30px 30px 0 0;padding:14px 22px calc(26px + env(safe-area-inset-bottom,0px));transform:translateY(100%);transition:transform .4s cubic-bezier(.2,.9,.3,1)}
.ov.on .sheet{transform:none}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:30px;padding-bottom:26px}}
.grab{width:38px;height:5px;border-radius:5px;background:var(--fill);margin:0 auto 14px}
.sh-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sh-h h3{font-size:1.4rem;font-weight:700;letter-spacing:-.02em}
.done{border:none;background:none;color:var(--accent);font:600 1rem Inter,sans-serif;cursor:pointer}
.grp{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:14px;overflow:hidden}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;min-height:50px;font-size:.95rem}
.row+.row{border-top:1px solid var(--line)}
.row>label{font-weight:500}
.seg{display:flex;background:var(--fill);border-radius:10px;padding:2px}
.seg button{border:none;background:none;color:var(--text);font:500 .82rem Inter,sans-serif;padding:6px 12px;border-radius:8px;cursor:pointer}
.seg button.on{background:var(--card);box-shadow:0 1px 4px rgba(0,0,0,.18);font-weight:600}
:root[data-theme="dark"] .seg button.on{background:#636366}
.sw{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer;outline:1px solid var(--line)}
.sw button.on{border-color:var(--bg);outline:2px solid var(--text)}
input[type=color]{width:34px;height:28px;border:none;background:none;cursor:pointer}
input[type=number],input[type=time]{background:var(--fill);border:none;color:var(--text);font:500 .95rem Inter,sans-serif;padding:7px 10px;border-radius:9px;width:110px;text-align:right}
input[type=range]{accent-color:var(--accent);width:120px}
.tg{width:51px;height:31px;border-radius:20px;border:none;background:var(--fill);position:relative;cursor:pointer;transition:background .25s;flex:none}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:transform .25s}
.tg.on{background:#30d158}.tg.on::after{transform:translateX(20px)}
.rst{width:100%;border:none;background:var(--card);border:1px solid var(--line);color:var(--panic);font:600 .95rem Inter,sans-serif;padding:14px;border-radius:16px;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="glow"><i></i><i></i></div>
<div class="wallp" id="wallp"><div class="wall" id="wall"></div></div>
<main>
<header>
 <h1>Panic Mode</h1>
 <div class="btns">
  <button class="ib" id="bTheme" aria-label="Switch light or dark"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <button class="ib" id="bSet" aria-label="Open settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
 </div>
</header>

<div class="grid">
 <section class="card">
  <h2>Now</h2>
  <div class="clock">
   <div class="analog" id="analog" tabindex="0" role="button" aria-label="Tap to toggle tick sound">
    <svg viewBox="0 0 200 200"><circle class="face" cx="100" cy="100" r="96"/><g id="ticks"></g>
     <line class="hh" id="hh" x1="100" y1="100" x2="100" y2="58"/><line class="mh" id="mh" x1="100" y1="100" x2="100" y2="36"/>
     <line class="sh" id="sh" x1="100" y1="116" x2="100" y2="28"/><circle class="pin" cx="100" cy="100" r="5"/></svg>
   </div>
   <div class="dig">
    <div><span class="digits time" id="time"></span><span class="ampm" id="ampm"></span></div>
    <div class="date" id="date"></div>
   </div>
  </div>
 </section>

 <section class="card panic" id="panic">
  <h2><span class="live"></span><span id="pTitle">Time left today</span></h2>
  <div class="prow">
   <div><div class="pl">Countdown</div><span class="digits cd down" id="cd"></span></div>
   <div style="text-align:right"><div class="pl">Target left to earn</div><span class="digits money down" id="mon"></span></div>
  </div>
  <div class="bar"><div id="pBar"></div></div>
  <div class="note" id="pNote"></div>
 </section>

 <section class="card">
  <h2>Progress</h2>
  <div class="rw">
   <svg class="rings" viewBox="0 0 200 200" id="rings" aria-hidden="true"></svg>
   <div class="leg" id="leg"></div>
  </div>
 </section>

 <section class="card">
  <div class="ch"><h2 id="cTitle"></h2><div class="cn"><button id="cPrev" aria-label="Previous month">‹</button><button id="cToday">Today</button><button id="cNext" aria-label="Next month">›</button></div></div>
  <div class="cg" id="cg"></div>
  <div class="cs" id="cs"></div>
 </section>
</div>
</main>

<div class="ov" id="ov">
 <div class="sheet" role="dialog" aria-label="Settings">
  <div class="grab"></div>
  <div class="sh-h"><h3>Settings</h3><button class="done" id="bDone">Done</button></div>
  <div class="grp">
   <div class="row"><label>Accent</label><div class="sw" id="sw"></div></div>
   <div class="row"><label>Appearance</label><div class="seg" data-k="theme"><button data-v="auto">Auto</button><button data-v="light">Light</button><button data-v="dark">Dark</button></div></div>
   <div class="row"><label>Clock</label><div class="seg" data-k="h24"><button data-v="false">12h</button><button data-v="true">24h</button></div></div>
   <div class="row"><label>Week starts</label><div class="seg" data-k="ws"><button data-v="0">Sun</button><button data-v="1">Mon</button></div></div>
  </div>
  <div class="grp">
   <div class="row"><label>Target amount ($)</label><input type="number" id="iTarget" min="0" step="10" inputmode="decimal"></div>
   <div class="row"><label>Deadline</label><div class="seg" data-k="dl"><button data-v="end">Midnight</button><button data-v="custom">Custom</button></div></div>
   <div class="row" id="rDl"><label>Deadline time</label><input type="time" id="iDl"></div>
  </div>
  <div class="grp">
   <div class="row"><label>Tick sound</label><button class="tg" id="tSound" aria-label="Toggle tick sound"></button></div>
   <div class="row"><label>Volume</label><input type="range" id="iVol" min="0" max="1" step=".05"></div>
  </div>
  <div class="grp">
   <div class="row"><label>Live wallpaper</label><div class="sw" id="wp"></div></div>
   <div class="row"><label>Your photo</label><div><button class="mini" id="bUp">Upload</button><button class="mini" id="bRm">Remove</button></div></div>
   <div class="wn" id="wNote">Pick a preset or upload a photo. It moves slowly and follows your mouse or phone tilt.</div>
   <div class="row"><label>Motion</label><button class="tg" id="tLive" aria-label="Toggle wallpaper motion"></button></div>
   <div class="row"><label>Parallax tilt</label><button class="tg" id="tPar" aria-label="Toggle parallax"></button></div>
   <div class="row"><label>Blur</label><input type="range" id="iBlur" min="0" max="24" step="1"></div>
   <div class="row"><label>Dim</label><input type="range" id="iDim" min="0" max=".7" step=".05"></div>
   <input type="file" id="iFile" accept="image/*" hidden>
  </div>
  <button class="rst" id="bReset">Reset everything</button>
 </div>
</div>

<script>
const $=s=>document.querySelector(s),R=document.documentElement,NS='http://www.w3.org/2000/svg';
const DEF={accent:'#ff9f0a',theme:'auto',h24:false,ws:0,sound:false,vol:.5,target:500,dl:'end',dlt:'18:00',wall:'',blur:0,dim:.2,live:true,par:true};
let S={...DEF};try{S={...DEF,...JSON.parse(localStorage.getItem('pm_settings')||'{}')}}catch(e){}
const save=()=>{try{localStorage.setItem('pm_settings',JSON.stringify(S))}catch(e){}};
const p2=n=>String(n).padStart(2,'0');
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const DAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

/* rolling digits: only changed characters animate */
function setD(el,str){
 if(el.dataset.v===str)return;el.dataset.v=str;
 if(el.children.length!==str.length){el.innerHTML=[...str].map(c=>'<i>'+c+'</i>').join('');return}
 [...str].forEach((c,i)=>{const n=el.children[i];if(n.textContent!==c){n.textContent=c;n.classList.remove('r');void n.offsetWidth;n.classList.add('r')}});
}

/* tick sound, synthesized so no external file is needed */
let ac;
function audio(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}}
function tick(){if(!S.sound||!ac)return;try{const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.value=1600;g.gain.setValueAtTime(.14*S.vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+.035);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.04)}catch(e){}}
function toggleSound(){S.sound=!S.sound;if(S.sound)audio();save();sync()}

/* clock face + rings */
for(let i=0;i<60;i++){const a=i*6*Math.PI/180,m=i%5===0,l=document.createElementNS(NS,'line');
 l.setAttribute('class','tk'+(m?' m':''));const r1=88,r2=m?78:83;
 l.setAttribute('x1',100+Math.sin(a)*r1);l.setAttribute('y1',100-Math.cos(a)*r1);l.setAttribute('x2',100+Math.sin(a)*r2);l.setAttribute('y2',100-Math.cos(a)*r2);$('#ticks').appendChild(l)}
const RG=[{n:'Day',c:'var(--accent)',r:90},{n:'Week',c:'#30d158',r:70},{n:'Month',c:'#0a84ff',r:50},{n:'Year',c:'#bf5af2',r:30}];
RG.forEach((g,i)=>{g.C=2*Math.PI*g.r;
 $('#rings').insertAdjacentHTML('beforeend','<circle class="t" cx="100" cy="100" r="'+g.r+'"/><circle class="p" id="rp'+i+'" cx="100" cy="100" r="'+g.r+'" stroke="'+g.c+'" stroke-dasharray="'+g.C+'" stroke-dashoffset="'+g.C+'"/>');
 $('#leg').insertAdjacentHTML('beforeend','<div class="lr"><i class="d" style="background:'+g.c+'"></i><div><b id="lp'+i+'">0%</b><span>'+g.n+'</span></div><em id="ld'+i+'"></em></div>')});

/* calendar */
let vY,vM;
function renderCal(now){
 const g=$('#cg');g.innerHTML='';$('#cTitle').textContent=MONTHS[vM]+' '+vY;
 for(let i=0;i<7;i++){g.insertAdjacentHTML('beforeend','<div class="w">'+DAYS[(i+S.ws)%7][0]+'</div>')}
 const first=(new Date(vY,vM,1).getDay()-S.ws+7)%7,total=new Date(vY,vM+1,0).getDate();
 for(let i=0;i<first;i++)g.appendChild(document.createElement('div'));
 const cur=new Date(vY,vM,1),nowM=new Date(now.getFullYear(),now.getMonth(),1);
 for(let d=1;d<=total;d++){let k='c';
  if(cur.getTime()<nowM.getTime()||(cur.getTime()===nowM.getTime()&&d<now.getDate()))k+=' past';
  else if(cur.getTime()===nowM.getTime()&&d===now.getDate())k+=' today';
  g.insertAdjacentHTML('beforeend','<div class="'+k+'">'+d+'</div>')}
 if(cur.getTime()===nowM.getTime()){const l=total-now.getDate();$('#cs').textContent=l===0?'Last day of the month.':l+' day'+(l>1?'s':'')+' left in '+MONTHS[vM]+'.'}
 else $('#cs').textContent='Viewing '+MONTHS[vM]+'. Tap Today to come back.';
}
const shift=n=>{vM+=n;if(vM<0){vM=11;vY--}if(vM>11){vM=0;vY++}renderCal(new Date())};
$('#cPrev').onclick=()=>shift(-1);$('#cNext').onclick=()=>shift(1);
$('#cToday').onclick=()=>{const n=new Date();vY=n.getFullYear();vM=n.getMonth();renderCal(n)};

/* per-second update */
let lastSec=-1,lastDay=-1;
function second(n){
 let h=n.getHours();const ap=h>=12?'PM':'AM';if(!S.h24)h=h%12||12;
 setD($('#time'),(S.h24?p2(h):h)+':'+p2(n.getMinutes())+':'+p2(n.getSeconds()));
 $('#ampm').textContent=S.h24?'':ap;
 $('#date').textContent=n.toLocaleDateString('en-US',{weekday:'long',year:'numeric',month:'long',day:'numeric'});
 /* panic */
 const cur=n.getHours()*3600+n.getMinutes()*60+n.getSeconds();
 let dl=86400;if(S.dl==='custom'){const [a,b]=S.dlt.split(':');dl=(+a*3600+ +b*60)||86400}
 const left=Math.max(0,dl-cur),frac=left/dl,hh=Math.floor(left/3600),mm=Math.floor(left%3600/60),ss=left%60;
 setD($('#cd'),p2(hh)+':'+p2(mm)+':'+p2(ss));
 setD($('#mon'),'$'+(S.target*frac).toFixed(2));
 $('#pBar').style.width=((1-frac)*100)+'%';
 $('#panic').classList.toggle('hot',left>0&&left<3600);
 $('#pTitle').textContent=left===0?'Time’s up':(S.dl==='custom'?'Time left until deadline':'Time left today');
 $('#pNote').textContent=left===0?'Deadline passed. Reset tomorrow with a fresh target.':'You need about $'+(left>0?(S.target/(dl/3600)).toFixed(2):'0.00')+' per hour to hit $'+(+S.target).toFixed(0)+' on time.';
 /* rings */
 const day=cur/86400,dow=(n.getDay()-S.ws+7)%7,dim=new Date(n.getFullYear(),n.getMonth()+1,0).getDate();
 const y0=new Date(n.getFullYear(),0,1),y1=new Date(n.getFullYear()+1,0,1);
 const P=[day,(dow+day)/7,(n.getDate()-1+day)/dim,(n-y0)/(y1-y0)];
 const D=[Math.ceil(left/3600*(dl===86400?1:1))+'h left',(7-dow-1)+' days left',(dim-n.getDate())+' days left',Math.ceil((y1-n)/864e5)-1+' days left'];
 D[0]=Math.floor((86400-cur)/3600)+'h left';
 P.forEach((p,i)=>{$('#rp'+i).style.strokeDashoffset=RG[i].C*(1-p);$('#lp'+i).textContent=(p*100).toFixed(1)+'%';$('#ld'+i).textContent=D[i]});
 if(n.getDate()!==lastDay){lastDay=n.getDate();vY=n.getFullYear();vM=n.getMonth();renderCal(n)}
 tick();
}
function frame(){
 const n=new Date(),s=n.getSeconds()+n.getMilliseconds()/1000,m=n.getMinutes()+s/60,h=n.getHours()%12+m/60;
 $('#sh').setAttribute('transform','rotate('+s*6+' 100 100)');
 $('#mh').setAttribute('transform','rotate('+m*6+' 100 100)');
 $('#hh').setAttribute('transform','rotate('+h*30+' 100 100)');
 if(n.getSeconds()!==lastSec){lastSec=n.getSeconds();second(n)}
 requestAnimationFrame(frame);
}

/* settings */
const COL=['#ff9f0a','#ff453a','#ff375f','#bf5af2','#0a84ff','#30d158','#64d2ff'];
COL.forEach(c=>$('#sw').insertAdjacentHTML('beforeend','<button style="background:'+c+'" data-c="'+c+'" aria-label="Accent '+c+'"></button>'));
$('#sw').insertAdjacentHTML('beforeend','<input type="color" id="iCol" aria-label="Custom accent">');
function sync(){
 R.style.setProperty('--accent',S.accent);
 if(S.theme==='auto')R.removeAttribute('data-theme');else R.setAttribute('data-theme',S.theme);
 document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.v===String(S[s.dataset.k]))));
 document.querySelectorAll('#sw button').forEach(b=>b.classList.toggle('on',b.dataset.c===S.accent));
 $('#iCol').value=S.accent;$('#iTarget').value=S.target;$('#iDl').value=S.dlt;$('#iVol').value=S.vol;
 $('#rDl').style.display=S.dl==='custom'?'flex':'none';
 $('#tSound').classList.toggle('on',S.sound);applyWall();
 lastSec=-1;
}
document.querySelectorAll('.seg').forEach(s=>s.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 let v=b.dataset.v;v=v==='true'?true:v==='false'?false:/^\d+$/.test(v)?+v:v;S[s.dataset.k]=v;save();sync();renderCal(new Date())}));
$('#sw').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.accent=b.dataset.c;save();sync()}});
$('#iCol').oninput=e=>{S.accent=e.target.value;save();sync()};
$('#iTarget').oninput=e=>{S.target=Math.max(0,+e.target.value||0);save();lastSec=-1};
$('#iDl').onchange=e=>{S.dlt=e.target.value||'18:00';save();lastSec=-1};
$('#iVol').oninput=e=>{S.vol=+e.target.value;save()};
$('#tSound').onclick=toggleSound;
$('#analog').onclick=toggleSound;
$('#analog').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleSound()}};
$('#bTheme').onclick=()=>{const dark=R.dataset.theme?R.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;S.theme=dark?'light':'dark';save();sync()};
const ov=$('#ov'),open=()=>ov.classList.add('on'),close=()=>ov.classList.remove('on');
$('#bSet').onclick=open;$('#bDone').onclick=close;
ov.addEventListener('click',e=>{if(e.target===ov)close()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('#bReset').onclick=()=>{S={...DEF};wallData=null;try{localStorage.removeItem('pm_wall')}catch(e){}save();sync();renderCal(new Date())};

/* live wallpaper */
const PRE={aurora:'linear-gradient(120deg,#0f2027,#2c5364,#7f00ff,#00c6ff,#0f2027)',sunset:'linear-gradient(120deg,#ff5f6d,#ffc371,#ff8a00,#c33764,#ff5f6d)',ocean:'linear-gradient(120deg,#021b79,#0575e6,#00f2fe,#4facfe,#021b79)',forest:'linear-gradient(120deg,#0b3d2e,#1d976c,#93f9b9,#134e5e,#0b3d2e)'};
let wallData=null;try{wallData=localStorage.getItem('pm_wall')}catch(e){}
$('#wp').insertAdjacentHTML('beforeend','<button data-w="" style="background:var(--fill)" aria-label="No wallpaper"></button>');
Object.keys(PRE).forEach(k=>$('#wp').insertAdjacentHTML('beforeend','<button data-w="'+k+'" style="background:'+PRE[k]+'" aria-label="'+k+' wallpaper"></button>'));
const rmo=matchMedia('(prefers-reduced-motion:reduce)').matches;
function par(x,y){const p=$('#wallp');if(!S.par||rmo){p.style.transform='';return}p.style.transform='translate('+(-x*28)+'px,'+(-y*28)+'px)'}
addEventListener('pointermove',e=>par(e.clientX/innerWidth-.5,e.clientY/innerHeight-.5));
addEventListener('deviceorientation',e=>{if(e.gamma==null)return;par(Math.max(-.5,Math.min(.5,e.gamma/60)),Math.max(-.5,Math.min(.5,(e.beta-45)/60)))});
function applyWall(){
 const w=$('#wall'),img=S.wall==='img'&&wallData,on=img||PRE[S.wall];
 document.body.classList.toggle('hasw',!!on);document.body.classList.toggle('still',!S.live);
 w.classList.toggle('on',!!on);w.classList.toggle('grad',!img&&!!PRE[S.wall]);w.classList.toggle('still',!S.live);
 w.style.backgroundImage=img?'url('+wallData+')':(PRE[S.wall]||'none');
 w.style.filter='blur('+S.blur+'px) brightness('+(1-S.dim)+') saturate(1.15)';
 document.querySelectorAll('#wp button').forEach(b=>b.classList.toggle('on',b.dataset.w===S.wall));
 $('#tLive').classList.toggle('on',S.live);$('#tPar').classList.toggle('on',S.par);
 $('#iBlur').value=S.blur;$('#iDim').value=S.dim;par(0,0);
}
$('#wp').addEventListener('click',e=>{const b=e.target.closest('button');if(b){S.wall=b.dataset.w;save();applyWall()}});
$('#bUp').onclick=()=>$('#iFile').click();
$('#bRm').onclick=()=>{wallData=null;try{localStorage.removeItem('pm_wall')}catch(e){}S.wall='';save();applyWall();$('#wNote').textContent='Photo removed.'};
$('#iFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{const im=new Image();
  im.onload=()=>{const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
   wallData=c.toDataURL('image/jpeg',.82);let ok=true;try{localStorage.setItem('pm_wall',wallData)}catch(x){ok=false}
   $('#wNote').textContent=ok?'Photo saved on this device.':'Photo is too large to store, so it stays until you close this page.';
   S.wall='img';save();applyWall()};
  im.onerror=()=>{$('#wNote').textContent='Couldn’t read that file. Try a JPG or PNG.'};im.src=fr.result};
 fr.readAsDataURL(f);e.target.value=''};
$('#tLive').onclick=()=>{S.live=!S.live;save();applyWall()};
$('#tPar').onclick=()=>{S.par=!S.par;save();applyWall()};
$('#iBlur').oninput=e=>{S.blur=+e.target.value;save();applyWall()};
$('#iDim').oninput=e=>{S.dim=+e.target.value;save();applyWall()};

sync();requestAnimationFrame(frame);
</script>
</body>
</html>
