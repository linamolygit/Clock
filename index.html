<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panic Mode Dashboard Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Oswald:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Colors */
            --accent-color: #ff8c00; 
            --accent-fade: rgba(255, 140, 0, 0.4);
            --panic-color: #ff3333; /* Red Alert Color */
            
            /* Theme Variables */
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --shadow-light: 10px 10px 20px #d1d9e6, -10px -10px 20px #ffffff;
            --glass-border: rgba(255, 255, 255, 0.8);
            --toggle-bg: #e0e0e0;
        }

        body.dark-mode {
            --bg-color: #18191a;
            --card-bg: #242526;
            --text-primary: #e4e6eb;
            --text-secondary: #b0b3b8;
            --shadow-light: 10px 10px 20px #0f0f10, -10px -10px 20px #2d2f31;
            --glass-border: rgba(255, 255, 255, 0.1);
            --toggle-bg: #3a3b3c;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg-color); color: var(--text-primary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .container {
            background-color: var(--card-bg); padding: 40px; border-radius: 30px;
            box-shadow: var(--shadow-light); width: 100%; max-width: 600px; position: relative;
        }

        /* --- Icons --- */
        .icon-btn {
            position: absolute; top: 20px; width: 40px; height: 40px;
            background: var(--toggle-bg); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; cursor: pointer;
            box-shadow: var(--shadow-light); z-index: 100;
        }
        .icon-btn svg { width: 20px; height: 20px; fill: var(--text-primary); }
        .theme-switch { right: 20px; }
        .edit-theme-btn { left: 20px; }

        /* --- Top Section --- */
        .top-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        
        /* Analog Clock (Clickable for Sound) */
        .analog-clock {
            width: 140px; height: 140px; border-radius: 50%; background: var(--card-bg);
            box-shadow: var(--shadow-light); position: relative; display: flex; justify-content: center; align-items: center;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.3s;
        }
        .analog-clock:active { transform: scale(0.95); }
        .analog-clock::before { content: ''; width: 8px; height: 8px; background: var(--accent-color); border-radius: 50%; z-index: 10; }
        
        .hand { position: absolute; bottom: 50%; left: 50%; transform-origin: bottom; background: var(--text-primary); border-radius: 4px; transform: translateX(-50%); }
        .hour-hand { height: 35px; width: 4px; z-index: 3; }
        .min-hand { height: 50px; width: 3px; z-index: 2; background: var(--text-secondary); }
        .sec-hand { height: 55px; width: 2px; background: var(--accent-color); z-index: 1; }

        /* Digital Clock */
        .digital-info { flex: 1; text-align: right; min-width: 200px; }
        
        .casino-clock {
            display: flex; justify-content: flex-end; align-items: center;
            font-family: 'Oswald', sans-serif; 
            font-size: 3.5rem; 
            font-weight: 700;
            color: var(--accent-color); 
            margin-bottom: 0px; height: 70px; overflow: hidden;
            letter-spacing: -3px; 
        }
        
        .digit-wrapper { display: inline-block; position: relative; height: 100%; width: 30px; text-align: center; }
        .digit-value { display: block; position: absolute; width: 100%; height: 100%; top: 0; left: 0; }
        
        /* Animation UP (For Main Clock) */
        .slide-up-animate { animation: slideUp 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes slideUp {
            0% { transform: translateY(100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        /* Animation DOWN (For Panic Countdown) */
        .slide-down-animate { animation: slideDown 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); }
        @keyframes slideDown {
            0% { transform: translateY(-100%); opacity: 0; }
            100% { transform: translateY(0); opacity: 1; }
        }

        .colon { margin: 0 2px; opacity: 1; padding-bottom: 8px;}
        .date-display { font-size: 1.1rem; color: var(--text-primary); font-weight: 500; margin-top: 0px; margin-bottom: 10px; }

        /* --- Panic Section (Red Alert) --- */
        .panic-section {
            margin-top: 10px;
            margin-bottom: 25px;
            text-align: right;
            border-top: 1px solid rgba(0,0,0,0.1);
            padding-top: 10px;
        }

        .panic-row {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            font-family: 'Oswald', sans-serif;
            color: var(--panic-color);
            margin-bottom: 5px;
        }

        /* Fixed width labels for proper alignment */
        .panic-label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-right: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
            width: 70px; /* Aligns "Left" and "Target" */
            text-align: right;
        }

        /* Smaller Casino Clock for Panic Mode */
        .small-casino {
            height: 30px;
            font-size: 1.5rem;
            overflow: hidden;
            color: var(--panic-color);
            letter-spacing: -1px;
            display: flex;
            align-items: center;
        }
        .small-casino .digit-wrapper { width: 14px; }
        .small-casino .colon { margin: 0 1px; padding-bottom: 2px; }
        .small-casino .dot { margin: 0 1px; font-size: 1.2rem; line-height: 1; padding-bottom: 5px;}

        /* Emoji closer to number */
        .dollar-icon {
            font-size: 1.2rem;
            margin-right: 2px; 
            margin-left: 5px;
        }

        /* --- Glass Tube Progress Bars --- */
        .progress-section { margin-bottom: 25px; }
        .progress-group { margin-bottom: 15px; }
        .progress-header { display: flex; justify-content: space-between; margin-bottom: 5px; font-size: 0.85rem; color: var(--text-secondary); }
        .blinking-text { animation: blinker 1s linear infinite; font-weight: bold; color: var(--accent-color); }
        @keyframes blinker { 50% { opacity: 0.3; } }

        .glass-tube {
            width: 100%; height: 26px; 
            background: rgba(100, 100, 100, 0.05);
            border-radius: 20px;
            position: relative;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.1), 0 2px 5px rgba(255,255,255,0.5);
            border: 2px solid var(--glass-border);
            overflow: hidden;
            backdrop-filter: blur(2px);
        }

        .glass-tube::after {
            content: ''; position: absolute; top: 2px; left: 5%; width: 90%; height: 40%;
            background: linear-gradient(to bottom, rgba(255,255,255,0.8), rgba(255,255,255,0.1));
            border-radius: 20px; z-index: 5; pointer-events: none;
        }

        .liquid-fill {
            height: 100%; width: 0%; 
            background: var(--accent-color);
            border-radius: 20px;
            position: relative;
            box-shadow: 0 0 10px var(--accent-color);
            overflow: hidden;
        }
        
        /* Bouncing Bubbles */
        .bubble {
            position: absolute; border-radius: 50%;
            background: rgba(255, 255, 255, 0.7); 
            box-shadow: 0 0 4px rgba(255,255,255,0.9);
            pointer-events: none;
            animation: moveRight 2s linear infinite forwards, bounceEffect 1s ease-in-out infinite alternate;
        }

        @keyframes moveRight {
            0% { left: -10%; opacity: 0; transform: scale(0.5); }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { left: 110%; opacity: 0; transform: scale(1.1); }
        }

        @keyframes bounceEffect {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); } 
        }

        /* --- Month Dots --- */
        .month-section h4 { margin-bottom: 15px; color: var(--text-primary); font-size: 1rem; font-weight: 600; }
        .dots-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 10px; justify-content: center; align-items: center; }
        
        .day-dot {
            width: 14px; height: 14px; border-radius: 50%; margin: auto;
            background-color: var(--accent-color); transition: all 0.3s ease;
            display: flex; align-items: center; justify-content: center;
        }
        .day-dot.past { opacity: 0.3; }
        .day-dot.future { opacity: 0.8; }
        
        .day-dot.today {
            width: 28px; height: 28px; 
            background-color: var(--accent-color); color: #fff; font-weight: 700; font-size: 0.85rem;
            cursor: pointer; box-shadow: 0 0 10px var(--accent-color);
            animation: firefly 2s infinite alternate;
        }
        @keyframes firefly {
            0% { box-shadow: 0 0 5px var(--accent-color); transform: scale(1); }
            100% { box-shadow: 0 0 15px var(--accent-color), 0 0 25px var(--accent-fade); transform: scale(1.1); }
        }

        /* --- Modals --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); z-index: 1000; display: none;
            justify-content: center; align-items: center; opacity: 0; transition: opacity 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }
        .modal-content {
            background: var(--card-bg); padding: 25px; border-radius: 20px;
            width: 90%; max-width: 400px; text-align: center; position: relative;
        }
        .modal-close-icon {
            position: absolute; top: 10px; right: 10px; width: 30px; height: 30px; 
            background: rgba(0,0,0,0.1); border-radius: 50%; color: var(--text-primary);
            font-weight: bold; font-size: 1.2rem; cursor: pointer; display: flex; align-items: center; justify-content: center; z-index: 10;
        }
        input[type="color"] { border: none; width: 60px; height: 60px; cursor: pointer; background: none; }
        .btn-action { margin-top: 15px; padding: 8px 20px; background: var(--accent-color); color: #fff; border: none; border-radius: 20px; cursor: pointer; font-weight: 600; }

        /* Calendar */
        .calendar-wrapper { background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.2); color: #333; text-align: left; position: relative; }
        .spiral-header { background: var(--accent-color); padding: 20px; color: #fff; position: relative; padding-right: 40px; }
        .spiral-rings { position: absolute; top: -10px; left: 0; width: 100%; display: flex; justify-content: space-evenly; }
        .ring { width: 15px; height: 30px; background: linear-gradient(90deg, #ccc, #fff, #ccc); border-radius: 10px; box-shadow: 0 2px 2px rgba(0,0,0,0.3); }
        .cal-month { font-size: 1.4rem; font-weight: 700; margin-top: 10px; }
        .cal-grid { padding: 15px; display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .cal-day-name { font-weight: 600; font-size: 0.8rem; color: #888; }
        .cal-date { padding: 8px; font-size: 0.9rem; border-radius: 50%; }
        .cal-date.active { background: var(--accent-color); color: white; }

        @media (max-width: 500px) {
            .top-section { justify-content: center; }
            .digital-info { text-align: center; }
            .casino-clock { justify-content: center; font-size: 3rem; }
            .panic-section { text-align: center; }
            .panic-row { justify-content: center; }
        }
    </style>
</head>
<body class="light-mode">

    <audio id="clockAudio" loop>
        <source src="https://github.com/linamolygit/My-videos/raw/refs/heads/main/slow-cinematic-clock-ticking-357979.mp3" type="audio/mpeg">
    </audio>

    <div class="container">
        <div class="icon-btn edit-theme-btn" onclick="openColorModal()" title="Theme Color"><svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg></div>
        <div class="icon-btn theme-switch" onclick="toggleTheme()" title="Toggle Mode"><svg id="theme-icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z"/></svg></div>

        <div class="top-section">
            <div class="analog-clock" onclick="toggleClockSound()" title="Tap to Play/Pause Sound">
                <div class="hand hour-hand" id="hourHand"></div>
                <div class="hand min-hand" id="minHand"></div>
                <div class="hand sec-hand" id="secHand"></div>
            </div>
            
            <div class="digital-info">
                <!-- Main Time -->
                <div class="casino-clock" id="casinoClock">
                    <div class="digit-wrapper"><span class="digit-value" id="h1">0</span></div>
                    <div class="digit-wrapper"><span class="digit-value" id="h2">0</span></div>
                    <span class="colon">:</span>
                    <div class="digit-wrapper"><span class="digit-value" id="m1">0</span></div>
                    <div class="digit-wrapper"><span class="digit-value" id="m2">0</span></div>
                    <span class="colon">:</span>
                    <div class="digit-wrapper"><span class="digit-value" id="s1">0</span></div>
                    <div class="digit-wrapper"><span class="digit-value" id="s2">0</span></div>
                </div>
                <div class="date-display" id="dateDisplay">Loading...</div>

                <!-- Panic Section (Red Alert) -->
                <div class="panic-section">
                    <div class="panic-row">
                        <span class="panic-label">Left:</span>
                        <div class="small-casino">
                            <div class="digit-wrapper"><span class="digit-value" id="cd_h1">0</span></div>
                            <div class="digit-wrapper"><span class="digit-value" id="cd_h2">0</span></div>
                            <span class="colon">:</span>
                            <div class="digit-wrapper"><span class="digit-value" id="cd_m1">0</span></div>
                            <div class="digit-wrapper"><span class="digit-value" id="cd_m2">0</span></div>
                            <span class="colon">:</span>
                            <div class="digit-wrapper"><span class="digit-value" id="cd_s1">0</span></div>
                            <div class="digit-wrapper"><span class="digit-value" id="cd_s2">0</span></div>
                        </div>
                    </div>
                    <div class="panic-row">
                        <span class="panic-label">Target:</span>
                        <span class="dollar-icon">💲</span>
                        <div class="small-casino">
                            <div class="digit-wrapper"><span class="digit-value" id="mon_1">5</span></div>
                            <div class="digit-wrapper"><span class="digit-value" id="mon_2">0</span></div>
                            <div class="digit-wrapper"><span class="digit-value" id="mon_3">0</span></div>
                            <span class="dot">.</span>
                            <div class="digit-wrapper"><span class="digit-value" id="mon_d1">0</span></div>
                            <div class="digit-wrapper"><span class="digit-value" id="mon_d2">0</span></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div class="progress-section">
            <div class="progress-group">
                <div class="progress-header"><span>Year Progress</span><span id="yearPercent" class="blinking-text">0%</span></div>
                <div class="glass-tube">
                    <div class="liquid-fill" id="yearBar"></div>
                </div>
            </div>
            <div class="progress-group">
                <div class="progress-header"><span>Week Progress</span><span id="weekPercent" class="blinking-text">0%</span></div>
                <div class="glass-tube">
                    <div class="liquid-fill" id="weekBar"></div>
                </div>
            </div>
        </div>

        <div class="month-section">
            <h4 id="monthName">Days in Month</h4>
            <div class="dots-grid" id="dotsGrid"></div>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal-overlay" id="colorModal">
        <div class="modal-content">
            <h3>Pick Theme Color</h3>
            <p style="margin-bottom:15px; font-size:0.9rem; color:var(--text-secondary)">Theme of the Day</p>
            <input type="color" id="themeColorInput" onchange="changeThemeColor(this.value)">
            <br>
            <button class="btn-action" onclick="closeColorModal()">Done</button>
            <p style="margin-top:10px; font-size:0.8rem; cursor:pointer; text-decoration:underline;" onclick="resetToDailyColor()">Reset to Auto</p>
        </div>
    </div>

    <div class="modal-overlay" id="calendarModal">
        <div class="modal-content" style="background: transparent; box-shadow: none; padding: 0;">
            <div class="modal-close-icon" onclick="closeCalendarModal()">×</div>
            <div class="calendar-wrapper" onclick="event.stopPropagation()">
                <div class="spiral-header">
                    <div class="spiral-rings">
                        <div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div><div class="ring"></div>
                    </div>
                    <div class="cal-month" id="calMonthDisplay">January 2024</div>
                </div>
                <div class="cal-grid" id="calGrid"></div>
            </div>
        </div>
    </div>

    <script>
        const root = document.documentElement;
        const dailyColors = ["#FFA500", "#800080", "#FF9933", "#FF6666", "#FFD700", "#FF69B4", "#464196"];
        
        let targetYearPct = 0;
        let targetWeekPct = 0;
        const clockAudio = document.getElementById('clockAudio');
        let isAudioPlaying = false;

        function toggleClockSound() {
            if (isAudioPlaying) {
                clockAudio.pause();
                isAudioPlaying = false;
            } else {
                clockAudio.play().catch(e => console.log("Audio Error:", e));
                isAudioPlaying = true;
            }
        }

        function initThemeColor() {
            const saved = localStorage.getItem('themeColor');
            if (saved) applyColor(saved);
            else applyColor(dailyColors[new Date().getDay()]);
        }
        function applyColor(hex) {
            root.style.setProperty('--accent-color', hex);
            root.style.setProperty('--accent-fade', hex + '4D');
            document.getElementById('themeColorInput').value = hex;
        }
        function changeThemeColor(hex) { applyColor(hex); localStorage.setItem('themeColor', hex); }
        function resetToDailyColor() { localStorage.removeItem('themeColor'); initThemeColor(); closeColorModal(); }

        /* --- Global State --- */
        let oldDigits = ['0','0','0','0','0','0']; // Main Clock
        let oldCD = ['0','0','0','0','0','0'];     // Countdown
        let oldMon = ['5','0','0','0','0'];        // Money (with decimals)

        // Helper: Main Clock (Upwards Animation)
        function animateDigit(id, newValue) {
            const el = document.getElementById(id);
            if (!el) return;
            const newEl = el.cloneNode(true);
            newEl.innerText = newValue;
            newEl.classList.add('slide-up-animate');
            el.parentNode.replaceChild(newEl, el);
            setTimeout(() => newEl.classList.remove('slide-up-animate'), 500);
        }

        // Helper: Panic Countdown (Downwards Animation)
        function animatePanicDigit(id, newValue) {
            const el = document.getElementById(id);
            if (!el) return;
            const newEl = el.cloneNode(true);
            newEl.innerText = newValue;
            newEl.classList.add('slide-down-animate');
            el.parentNode.replaceChild(newEl, el);
            setTimeout(() => newEl.classList.remove('slide-down-animate'), 500);
        }

        function updateClock() {
            const now = new Date();
            const sec = now.getSeconds();
            const min = now.getMinutes();
            const hour = now.getHours();
            
            // --- Analog Hand ---
            const secDeg = ((sec/60)*360);
            const minDeg = ((min/60)*360) + ((sec/60)*6);
            const hourDeg = ((hour/12)*360) + ((min/60)*30);
            document.getElementById('secHand').style.transform = `translateX(-50%) rotate(${secDeg}deg)`;
            document.getElementById('minHand').style.transform = `translateX(-50%) rotate(${minDeg}deg)`;
            document.getElementById('hourHand').style.transform = `translateX(-50%) rotate(${hourDeg}deg)`;

            // --- 1. Main Digital Clock (Up Animation) ---
            let h = hour % 12 || 12;
            const hStr = (h < 10 ? "0" + h : "" + h);
            const mStr = (min < 10 ? "0" + min : "" + min);
            const sStr = (sec < 10 ? "0" + sec : "" + sec);
            const newDigits = [hStr[0], hStr[1], mStr[0], mStr[1], sStr[0], sStr[1]];
            const ids = ['h1', 'h2', 'm1', 'm2', 's1', 's2'];
            const isFiveSecInterval = (sec % 5 === 0);

            newDigits.forEach((digit, index) => {
                const isSecondsTens = (index === 4); 
                let shouldAnimate = false;
                if (digit !== oldDigits[index]) shouldAnimate = true;
                if (isSecondsTens && isFiveSecInterval) shouldAnimate = true;
                if (shouldAnimate) animateDigit(ids[index], digit);
            });
            oldDigits = newDigits;

            // --- 2. Countdown Timer (Left) (Down Animation) ---
            const currentSecondsOfDay = (hour * 3600) + (min * 60) + sec;
            const secondsLeft = 86400 - currentSecondsOfDay;
            
            const cd_h = Math.floor(secondsLeft / 3600);
            const cd_m = Math.floor((secondsLeft % 3600) / 60);
            const cd_s = secondsLeft % 60;
            
            const cd_hStr = (cd_h < 10 ? "0" + cd_h : "" + cd_h);
            const cd_mStr = (cd_m < 10 ? "0" + cd_m : "" + cd_m);
            const cd_sStr = (cd_s < 10 ? "0" + cd_s : "" + cd_s);
            
            const newCD = [cd_hStr[0], cd_hStr[1], cd_mStr[0], cd_mStr[1], cd_sStr[0], cd_sStr[1]];
            const cdIds = ['cd_h1', 'cd_h2', 'cd_m1', 'cd_m2', 'cd_s1', 'cd_s2'];
            
            newCD.forEach((d, i) => {
                if (d !== oldCD[i]) animatePanicDigit(cdIds[i], d);
            });
            oldCD = newCD;

            // --- 3. Money Panic (Target) (Down Animation) ---
            // Money decreases continuously including decimals
            // Formula: 500 * (secondsLeft / 86400)
            const moneyVal = (500 * (secondsLeft / 86400)).toFixed(2); // "499.50"
            
            // Format to ensure we have 000.00 structure for parsing
            let [intPart, decPart] = moneyVal.split('.');
            while(intPart.length < 3) intPart = "0" + intPart; // Pad leading zeros
            
            const newMon = [intPart[0], intPart[1], intPart[2], decPart[0], decPart[1]];
            const monIds = ['mon_1', 'mon_2', 'mon_3', 'mon_d1', 'mon_d2'];
            
            newMon.forEach((d, i) => {
                if (d !== oldMon[i]) animatePanicDigit(monIds[i], d);
            });
            oldMon = newMon;

            // --- Date ---
            const opts = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('dateDisplay').innerText = now.toLocaleDateString('en-US', opts);
            calculateProgress(now);
        }

        /* --- Progress Loop --- */
        function calculateProgress(now) {
            const start = new Date(now.getFullYear(), 0, 0);
            const diff = now - start;
            const oneDay = 1000 * 60 * 60 * 24;
            const dayOfYear = Math.floor(diff / oneDay);
            const isLeap = (now.getFullYear() % 4 === 0 && now.getFullYear() % 100 !== 0) || (now.getFullYear() % 400 === 0);
            targetYearPct = ((dayOfYear / (isLeap ? 366 : 365)) * 100).toFixed(1);
            
            const dayOfWeek = now.getDay(); 
            targetWeekPct = (((dayOfWeek * 24 * 60) + (now.getHours() * 60) + now.getMinutes()) / (7 * 24 * 60) * 100).toFixed(1);

            document.getElementById('yearPercent').innerText = `${targetYearPct}%`;
            document.getElementById('weekPercent').innerText = `${targetWeekPct}%`;
        }

        function loopProgressAnimation() {
            const yearBar = document.getElementById('yearBar');
            const weekBar = document.getElementById('weekBar');
            yearBar.style.transition = 'none';
            weekBar.style.transition = 'none';
            yearBar.style.width = '0%';
            weekBar.style.width = '0%';
            setTimeout(() => {
                yearBar.style.transition = 'width 2s ease-out';
                weekBar.style.transition = 'width 2s ease-out';
                yearBar.style.width = targetYearPct + '%';
                weekBar.style.width = targetWeekPct + '%';
            }, 100);
        }

        /* --- BUBBLE STREAM --- */
        function startBubbleStream() {
            setInterval(() => {
                const count = Math.floor(Math.random() * 2) + 1; 
                for(let i=0; i<count; i++) {
                    createBubble('yearBar');
                    createBubble('weekBar');
                }
            }, 300); 
        }

        function createBubble(barId) {
            const bar = document.getElementById(barId);
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            const size = Math.random() * 8 + 4; 
            const top = Math.random() * 80; 
            const duration = (Math.random() * 1 + 1.5).toFixed(2);
            
            bubble.style.width = `${size}px`;
            bubble.style.height = `${size}px`;
            bubble.style.top = `${top}%`;
            bubble.style.left = `-15px`;
            bubble.style.animationDuration = `${duration}s, 1s`; 

            bar.appendChild(bubble);
            setTimeout(() => { bubble.remove(); }, duration * 1000); 
        }

        /* --- Dots --- */
        function generateMonthDots() {
            const now = new Date();
            const daysInMonth = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            const grid = document.getElementById('dotsGrid');
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('monthName').innerText = `${monthNames[now.getMonth()]} Progress`;
            grid.innerHTML = '';
            for (let i = 1; i <= daysInMonth; i++) {
                const dot = document.createElement('div');
                dot.classList.add('day-dot');
                if (i === now.getDate()) {
                    dot.classList.add('today'); dot.innerText = i; dot.onclick = openCalendarModal;
                } else if (i < now.getDate()) dot.classList.add('past');
                else dot.classList.add('future');
                grid.appendChild(dot);
            }
        }

        function openColorModal() { document.getElementById('colorModal').classList.add('active'); }
        function closeColorModal() { document.getElementById('colorModal').classList.remove('active'); }
        function openCalendarModal() { renderCalendar(); document.getElementById('calendarModal').classList.add('active'); }
        function closeCalendarModal() { document.getElementById('calendarModal').classList.remove('active'); }

        function renderCalendar() {
            const now = new Date();
            const grid = document.getElementById('calGrid');
            grid.innerHTML = '';
            const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
            document.getElementById('calMonthDisplay').innerText = `${monthNames[now.getMonth()]} ${now.getFullYear()}`;
            const firstDay = new Date(now.getFullYear(), now.getMonth(), 1).getDay();
            const totalDays = new Date(now.getFullYear(), now.getMonth() + 1, 0).getDate();
            ['S','M','T','W','T','F','S'].forEach(d => { const h = document.createElement('div'); h.className='cal-day-name'; h.innerText=d; grid.appendChild(h); });
            for(let i=0; i<firstDay; i++) grid.appendChild(document.createElement('div'));
            for(let i=1; i<=totalDays; i++) {
                const cell = document.createElement('div'); cell.className = 'cal-date'; cell.innerText = i;
                if(i === now.getDate()) cell.classList.add('active');
                grid.appendChild(cell);
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            document.querySelector('#theme-icon path').setAttribute('d', isDark ? "M6.76 4.84l-1.8-1.79-1.41 1.41 1.79 1.79 1.42-1.41zM4 10.5H1v2h3v-2zm9-9.95h-2V3.5h2V.55zm7.45 3.91l-1.41-1.41-1.79 1.79 1.41 1.41 1.79-1.79zm-3.21 13.7l1.79 1.79 1.41-1.41-1.79-1.79-1.41 1.41zM10.5 22h3v-3h-3v3zm7.95-9h3v-2h-3v2zm-13.5 7.3l1.41 1.41 1.79-1.79-1.41-1.41-1.79 1.79zM12 5.5a6.5 6.5 0 1 1 0 13 6.5 6.5 0 0 1 0-13z" : "M12 3a9 9 0 1 0 9 9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 1-4.4 2.26 5.403 5.403 0 0 1-3.14-9.8c-.44-.06-.9-.1-1.36-.1z");
        }

        initThemeColor();
        generateMonthDots();
        setInterval(updateClock, 1000);
        updateClock();
        setInterval(loopProgressAnimation, 5000);
        loopProgressAnimation();
        startBubbleStream();

    </script>
</body>
</html>
